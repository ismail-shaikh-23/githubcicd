name: Secrets and Variables Demo

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Print Project Name
        run: echo "Project: ${{ vars.PROJECT_NAME }}"

      - name: Check Secret
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          if [ -n "$DB_PASSWORD" ]; then
            echo "Database password is configured"
          else
            echo "Database password is missing"
          fi
